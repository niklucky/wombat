name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            ext: ''
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: 'go.mod'

      - name: Debug workspace
        shell: bash
        run: |
          pwd
          ls -la
          ls -la cmd/ || true
          ls -la cmd/wombat/ || true

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '0' }}
        run: |
          mkdir -p dist
          ldflags="-s -w"
          cd cmd/wombat
          go build -ldflags="${ldflags}" -o "../../dist/wombat${{ matrix.ext }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wombat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/wombat${{ matrix.ext }}
          retention-days: 3
