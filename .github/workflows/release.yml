name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
            archive: tar.gz
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            ext: ''
            archive: tar.gz
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
            archive: tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '0' }}
        run: |
          mkdir -p dist
          ldflags="-s -w"
          if [ "${{ github.ref_name }}" != "" ]; then
            ldflags="${ldflags} -X main.version=${{ github.ref_name }}"
          fi
          cd cmd/wombat
          go build -ldflags="${ldflags}" -o "../../dist/wombat${{ matrix.ext }}" .

      - name: Package
        shell: bash
        run: |
          cp README.md dist/
          name="wombat-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            if command -v zip >/dev/null 2>&1; then
              cd dist && zip -q "${name}.zip" "wombat${{ matrix.ext }}" README.md
            else
              powershell -Command "cd dist; Compress-Archive -Path 'wombat${{ matrix.ext }}', 'README.md' -DestinationPath '${name}.zip'"
            fi
          else
            tar -czf "dist/${name}.tar.gz" -C dist "wombat${{ matrix.ext }}" README.md
          fi
          ls -la dist/*.{tar.gz,zip} 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: wombat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/wombat-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*

  snap:
    name: Publish Snap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Build Snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # 1.3.0
        id: snap-build

      - name: Publish Snap
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # 1.2.0
        with:
          snap: ${{ steps.snap-build.outputs.snap }}
          release: stable
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  brew:
    name: Publish Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        uses: mislav/bump-homebrew-formula-action@ccf2332299a883f6af50a1d2d41e5df7904dd769 # 4.1
        with:
          formula-name: wombat
          homebrew-tap: niklucky/homebrew-tap
          tag-name: ${{ github.ref_name }}
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
