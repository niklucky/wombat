name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
            archive: tar.gz
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            ext: ''
            archive: tar.gz
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
            archive: tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          ldflags="-s -w"
          if [ "${{ github.ref_name }}" != "" ]; then
            ldflags="${ldflags} -X main.version=${{ github.ref_name }}"
          fi
          cd cmd/wombat
          go build -ldflags="${ldflags}" -o "../../dist/wombat${{ matrix.ext }}" .

      - name: Package
        shell: bash
        run: |
          cp README.md dist/
          name="wombat-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            if command -v zip >/dev/null 2>&1; then
              cd dist && zip -q "${name}.zip" "wombat${{ matrix.ext }}" README.md
            else
              powershell -Command "cd dist; Compress-Archive -Path 'wombat${{ matrix.ext }}', 'README.md' -DestinationPath '${name}.zip'"
            fi
          else
            tar -czf "dist/${name}.tar.gz" -C dist "wombat${{ matrix.ext }}" README.md
          fi
          ls -la dist/*.{tar.gz,zip} 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wombat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/wombat-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
