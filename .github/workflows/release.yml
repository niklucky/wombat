name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
            archive: tar.gz
          - os: macos-13
            goos: darwin
            goarch: amd64
            ext: ''
            archive: tar.gz
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
            archive: tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '0' }}
        run: |
          mkdir -p dist
          ldflags="-s -w"
          if [ "${{ github.ref_name }}" != "" ]; then
            ldflags="${ldflags} -X main.version=${{ github.ref_name }}"
          fi
          go build -ldflags="${ldflags}" -o "dist/wombat${{ matrix.ext }}" ./cmd/wombat

      - name: Package
        shell: bash
        run: |
          cp README.md dist/
          name="wombat-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cd dist && zip -q "${name}.zip" "wombat${{ matrix.ext }}" README.md
          else
            tar -czf "dist/${name}.tar.gz" -C dist "wombat${{ matrix.ext }}" README.md
          fi
          ls -la dist/*.{tar.gz,zip} 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wombat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/wombat-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
